<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Background: Deep Cyber Blue / Teal (High Contrast agar oren menyala & tidak nyatu) -->
  <rect width="16" height="16" fill="#0284c7"/>

  <!-- Telinga Kucing Oren (Orange Ears with Pink Inner) -->
  <rect x="3" y="2" width="3" height="3" fill="#ea580c"/>
  <rect x="4" y="3" width="1" height="1" fill="#fb7185"/>
  <rect x="10" y="2" width="3" height="3" fill="#ea580c"/>
  <rect x="11" y="3" width="1" height="1" fill="#fb7185"/>

  <!-- Kepala Kucing Oren (Orange Head) -->
  <rect x="4" y="4" width="8" height="8" fill="#f97316"/>
  <rect x="3" y="5" width="10" height="6" fill="#f97316"/>

  <!-- Belang Kucing Oren (Darker Orange Tabby Stripes) -->
  <rect x="7" y="4" width="2" height="2" fill="#c2410c"/>
  <rect x="3" y="6" width="1" height="2" fill="#c2410c"/>
  <rect x="12" y="6" width="1" height="2" fill="#c2410c"/>

  <!-- Kacamata Hitam Cyber (Black Shades with Cyan Lens Reflection) -->
  <rect x="4" y="6" width="3" height="2" fill="#090909"/>
  <rect x="5" y="6" width="2" height="1" fill="#38bdf8"/>
  <rect x="7" y="6" width="2" height="1" fill="#090909"/>
  <rect x="9" y="6" width="3" height="2" fill="#090909"/>
  <rect x="10" y="6" width="2" height="1" fill="#38bdf8"/>

  <!-- Moncong Putih & Hidung Pink (White Muzzle & Pink Nose) -->
  <rect x="6" y="9" width="4" height="2" fill="#ffffff"/>
  <rect x="7" y="9" width="2" height="1" fill="#fb7185"/>

  <!-- Kumis Kucing Putih (White Whiskers) -->
  <rect x="2" y="8" width="2" height="1" fill="#ffffff"/>
  <rect x="1" y="9" width="2" height="1" fill="#ffffff"/>
  <rect x="12" y="8" width="2" height="1" fill="#ffffff"/>
  <rect x="13" y="9" width="2" height="1" fill="#ffffff"/>

  <!-- Badan Kucing Oren & Kalung Merah dengan Lonceng Emas -->
  <rect x="4" y="12" width="8" height="4" fill="#f97316"/>
  <rect x="6" y="12" width="4" height="4" fill="#ffffff"/>
  <rect x="5" y="12" width="6" height="1" fill="#e11d48"/>
  <rect x="7" y="13" width="2" height="1" fill="#facc15"/>
</svg>
